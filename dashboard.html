<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;

    /* 🌿 Background image */
    background: url('your-image.jpg') no-repeat center center fixed;
    background-size: cover;
}

/* ✨ Overlay */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.75);
    z-index: -1;
}

/* HEADER */
.header {
    background: linear-gradient(to right, #2563eb, #6d28d9);
    color: white;
    padding: 30px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logout {
    cursor: pointer;
}

/* STATS */
.stats {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.card {
    background: white;
    color: #111827;
    padding: 20px;
    border-radius: 12px;
    flex: 1;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.card h3 {
    margin: 0;
    font-size: 24px;
}

.card p {
    margin: 5px 0 0;
    color: #6b7280;
}

/* CONTAINER */
.container {
    padding: 30px;
    background: rgba(255, 255, 255, 0.9);
    margin: 20px;
    border-radius: 16px;
}

/* SUBJECTS */
.subjects {
    display: flex;
    gap: 20px;
    overflow-x: auto;
}

.subject-card {
    background: white;
    border: 2px solid #e5e7eb;  /* 👈 adds visible border */
    border-radius: 12px;
    padding: 20px;
    font-weight: 600;
    color: #111827;             /* 👈 ensures text is visible */
    
    cursor: pointer;
    transition: all 0.2s ease;

    min-width: 220px;
    text-align: center;
}
.subject-card:hover {
    border-color: #2563eb;      /* 👈 blue border on hover */
    background: #eff6ff;        /* 👈 light blue background */
    transform: translateY(-3px);
}
</style>
</head>

<body>

<div class="header">
    <div class="top-bar">
        <h2>Ekon-Flashcards</h2>
        <div>Welcome, <span id="username"></span> | 
            <span class="logout" onclick="logout()">Logout</span>
        </div>
    </div>

    <h1>My Learning Dashboard</h1>

    <div class="stats">
        <div class="card">
            <h3 id="lessons">0</h3>
            <p>Lessons Available</p>
        </div>

        <div class="card">
            <h3 id="quizzes">0</h3>
            <p>Quizzes Completed</p>
        </div>

        <div class="card">
            <h3 id="points">0</h3>
            <p>Points Earned</p>
        </div>
    </div>
</div>

<div class="container">
    <h2>Available Courses</h2>

    <div class="subjects">
        <div class="subject-card" onclick="openMicro()">Microeconomics</div>
        <div class="subject-card" onclick="openMacro()">Macroeconomics</div>
        <div class="subject-card" onclick="openEHI()">Economic History Of India</div>
        <div class="subject-card" onclick="openStat()">Statistics For Economics</div>
        <div class="subject-card" onclick="openDE()">Development Economics</div>
    </div>
</div>

<script>
// Load data
const username = localStorage.getItem("username");
const lessons = localStorage.getItem("lessons");
const quizzes = localStorage.getItem("quizzes");
const points = localStorage.getItem("points");

document.getElementById("username").innerText = username || "User";
document.getElementById("lessons").innerText = lessons || 0;
document.getElementById("quizzes").innerText = quizzes || 0;
document.getElementById("points").innerText = points || 0;

// Logout
function logout() {
    localStorage.clear();
    window.location.href = "index.html";
}

// Navigation
function openMicro() {
    window.location.href = "microeconomics.html";
}

function openMacro() {
    window.location.href = "macroeconomics.html";
}

function openEHI() {
    window.location.href = "ehi.html";
}

function openStat() {
    window.location.href = "statistics.html";
}

function openDE() {
    window.location.href = "development.html";
}
</script>

</body>
</html>
