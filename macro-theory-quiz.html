<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theory Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="macro-theory-quiz.css">
</head>

<body>

<div class="top">
    <div class="back" onclick="goBack()">â† Back</div>
    <div id="progress">Question 1/10</div>
</div>

<div class="card" id="card">
    <div class="card-inner">
        <div class="card-front">
            <h3 id="question"></h3>
            <div id="options"></div>
        </div>
        <div class="card-back" id="answer"></div>
    </div>
</div>

<div class="nav">
    <button class="prev" onclick="prevQ()">Previous</button>
    <button class="next" onclick="nextQ()">Next</button>
</div>

<script>
const questions = [
    {q:"Macroeconomics studies:",options:["Individual firms","Entire economy","Single consumer","Single market"],ans:"Entire economy"},
    {q:"GDP measures:",options:["Total domestic production","Imports only","Exports only","Government revenue"],ans:"Total domestic production"},
    {q:"GNP includes:",options:["Foreign aid","Income from abroad","Imports","Taxes only"],ans:"Income from abroad"},
    {q:"NNP is obtained after deducting:",options:["Exports","Taxes","Depreciation","Imports"],ans:"Depreciation"},
    {q:"Disposable income means:",options:["Income before tax","Income after tax","Government income","Firm profit"],ans:"Income after tax"},
    {q:"Which method measures national income using expenditures?",options:["Income method","Production method","Expenditure method","Tax method"],ans:"Expenditure method"},
    {q:"Circular flow of income shows:",options:["Population growth","Movement of income and expenditure","Trade deficit","Inflation"],ans:"Movement of income and expenditure"},
    {q:"The two-sector model includes:",options:["Government and foreign sector","Households and firms","Banks and firms","Government and firms"],ans:"Households and firms"},
    {q:"Leakages in circular flow include:",options:["Investment","Government spending","Savings","Exports"],ans:"Savings"},
    {q:"Injections in circular flow include:",options:["Taxes","Savings","Investment","Imports"],ans:"Investment"},
    {q:"Money mainly acts as:",options:["Luxury good","Medium of exchange","Natural resource","Tax"],ans:"Medium of exchange"},
    {q:"Which is a function of money?",options:["Population control","Store of value","Weather forecasting","Production"],ans:"Store of value"},
    {q:"Money supply is mainly controlled by:",options:["Consumers","Central bank","Firms","Exporters"],ans:"Central bank"},
    {q:"Demand for money for daily transactions is called:",options:["Speculative motive","Precautionary motive","Transaction motive","Investment motive"],ans:"Transaction motive"},
    {q:"Inflation means:",options:["Fall in prices","Rise in prices","Stable prices","Zero prices"],ans:"Rise in prices"},
    {q:"Unemployment means:",options:["No trade","People without jobs","Price rise","Taxation"],ans:"People without jobs"},
    {q:"Keynesian economics emphasizes:",options:["Aggregate demand","Aggregate supply","Exports only","Imports only"],ans:"Aggregate demand"},
    {q:"Keynesian model explains:",options:["Population growth","Income and employment","Weather changes","Exports"],ans:"Income and employment"},
    {q:"Consumption function shows relation between:",options:["Income and consumption","Exports and imports","Savings and taxes","Price and quantity"],ans:"Income and consumption"},
    {q:"MPC stands for:",options:["Marginal Propensity to Consume","Maximum Production Cost","Money Production Curve","Marginal Product Curve"],ans:"Marginal Propensity to Consume"},
    {q:"Multiplier effect means:",options:["Income increases by larger amount","Prices fall","Taxes increase","Imports decrease"],ans:"Income increases by larger amount"},
    {q:"According to Keynes, unemployment occurs due to:",options:["High exports","Insufficient demand","Too much savings","High imports"],ans:"Insufficient demand"},
    {q:"IS curve represents equilibrium in:",options:["Money market","Goods market","Labor market","Foreign market"],ans:"Goods market"},
    {q:"LM curve represents equilibrium in:",options:["Goods market","Money market","Labor market","Export market"],ans:"Money market"},
    {q:"IS-LM model determines:",options:["Weather","Income and interest rate","Population","Exports"],ans:"Income and interest rate"},
    {q:"Aggregate demand includes:",options:["Consumption only","Investment only","Government spending only","All of these"],ans:"All of these"},
    {q:"Aggregate supply represents:",options:["Total production","Total imports","Total taxes","Total savings"],ans:"Total production"},
    {q:"AD curve generally slopes:",options:["Upward","Downward","Vertical","Horizontal"],ans:"Downward"},
    {q:"Fiscal policy mainly involves:",options:["Interest rates","Government spending and taxation","Imports","Exports"],ans:"Government spending and taxation"},
    {q:"Monetary policy mainly controls:",options:["Population","Money supply and interest rates","Exports","Imports"],ans:"Money supply and interest rates"}
];

let current = 0;
let selectedAnswers = new Array(questions.length).fill(null);
const storageKey = "macrotheoryquiz";
const legacyProgressKey = "theoryProgress";

let savedIndex = localStorage.getItem(storageKey + "Current");
let savedAnswers = JSON.parse(localStorage.getItem(storageKey + "Answers"));

if (savedAnswers && savedAnswers.length === questions.length) selectedAnswers = savedAnswers;

if (savedIndex !== null) {
    current = Math.min(parseInt(savedIndex), questions.length - 1);
}

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const answerEl = document.getElementById("answer");
const progressEl = document.getElementById("progress");
const card = document.getElementById("card");
const navEl = document.querySelector(".nav");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

function getScore() {
    return selectedAnswers.reduce((score, answer, index) => {
        return answer === questions[index].ans ? score + 1 : score;
    }, 0);
}

function saveProgress() {
    const attempted = selectedAnswers.filter(answer => answer !== null).length;
    localStorage.setItem(storageKey + "Progress", attempted);
    localStorage.setItem(legacyProgressKey, attempted);
    localStorage.setItem(storageKey + "Current", current);
    localStorage.setItem(storageKey + "Answers", JSON.stringify(selectedAnswers));
}

function loadQuestion() {
    const q = questions[current];
    const selected = selectedAnswers[current];

    questionEl.innerText = q.q;
    answerEl.innerText = "Answer: " + q.ans;
    progressEl.innerText = "Question " + (current + 1) + "/" + questions.length;
    nextBtn.innerText = current === questions.length - 1 ? "Finish" : "Next";
    prevBtn.style.visibility = current === 0 ? "hidden" : "visible";
    navEl.classList.remove("results-nav");

    optionsEl.innerHTML = "";

    q.options.forEach(opt => {
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt;

        if (selected !== null) {
            if (opt === q.ans) div.classList.add("correct");
            if (opt === selected && selected !== q.ans) div.classList.add("wrong");
        }

        div.onclick = (e) => {
            e.stopPropagation();
            selectedAnswers[current] = opt;
            saveProgress();
            loadQuestion();
        };

        optionsEl.appendChild(div);
    });

    card.classList.remove("flip");
}

function showResults() {
    const correct = getScore();
    const wrong = questions.length - correct;
    const percent = Math.round((correct / questions.length) * 100);

    progressEl.innerText = "Quiz Complete";
    card.classList.remove("flip");
    card.innerHTML = [
        '<div class="result-card">',
        '<p class="result-label">Final Score</p>',
        '<h2>' + correct + '/' + questions.length + ' correct</h2>',
        '<div class="score-grid">',
        '<div class="score-pill correct-score"><strong>' + correct + '</strong><span>Correct</span></div>',
        '<div class="score-pill wrong-score"><strong>' + wrong + '</strong><span>Wrong</span></div>',
        '<div class="score-pill percent-score"><strong>' + percent + '%</strong><span>Score</span></div>',
        '</div>',
        '</div>'
    ].join('');
    navEl.classList.add("results-nav");
    prevBtn.style.visibility = "visible";
    prevBtn.innerText = "Review Quiz";
    nextBtn.innerText = "Try Again";
}

card.addEventListener("click", () => {
    if (card.querySelector(".card-inner")) {
        card.classList.toggle("flip");
    }
});

function nextQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        selectedAnswers = new Array(questions.length).fill(null);
        saveProgress();
        window.location.reload();
        return;
    }

    if (current < questions.length - 1) {
        current++;
        saveProgress();
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        saveProgress();
        window.location.reload();
        return;
    }

    if (current > 0) {
        current--;
        saveProgress();
        loadQuestion();
    }
}

function goBack() {
    window.location.href = "macroeconomics.html";
}

loadQuestion();
</script>

</body>
</html>
