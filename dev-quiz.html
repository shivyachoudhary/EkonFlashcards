<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theory Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="dev-quiz.css">
</head>

<body>

<div class="top">
    <div class="back" onclick="goBack()">â† Back</div>
    <div id="progress">Question 1/10</div>
</div>

<div class="card" id="card">
    <div class="card-inner">
        <div class="card-front">
            <h3 id="question"></h3>
            <div id="options"></div>
        </div>
        <div class="card-back" id="answer"></div>
    </div>
</div>

<div class="nav">
    <button class="prev" onclick="prevQ()">Previous</button>
    <button class="next" onclick="nextQ()">Next</button>
</div>

<script>
const questions = [
    {q:"What is the main goal of development economics?",options:["Increasing military power","Improving quality of life","Increasing exports only","Reducing imports"],ans:"Improving quality of life"},
    {q:"HDI stands for:",options:["Human Development Index","Human Data Indicator","High Development Income","Human Distribution Index"],ans:"Human Development Index"},
    {q:"Which organization publishes the HDI?",options:["IMF","WTO","UNDP","World Bank"],ans:"UNDP"},
    {q:"Which of the following is NOT a component of HDI?",options:["Education","Life expectancy","Income","Exchange rate"],ans:"Exchange rate"},
    {q:"Poverty trap means:",options:["A country becomes rich quickly","Poor people remain poor due to lack of resources","Government removes poverty","Prices increase rapidly"],ans:"Poor people remain poor due to lack of resources"},
    {q:"Who introduced the capability approach?",options:["Adam Smith","Amartya Sen","David Ricardo","Karl Marx"],ans:"Amartya Sen"},
    {q:"Sustainable development means:",options:["Development only for present generation","Rapid industrialization","Development without harming future generations","Urban development only"],ans:"Development without harming future generations"},
    {q:"Which indicator measures income inequality?",options:["GDP","CPI","Gini Coefficient","HDI"],ans:"Gini Coefficient"},
    {q:"Primary sector mainly includes:",options:["Banking","Agriculture","Manufacturing","IT services"],ans:"Agriculture"},
    {q:"Microfinance mainly helps:",options:["Large industries","Poor households and small businesses","Government departments","International companies"],ans:"Poor households and small businesses"},
    {q:"Lewis model focuses on:",options:["Dual sector economy","Inflation","Taxation","International trade"],ans:"Dual sector economy"},
    {q:"Rostow is associated with:",options:["Stages of economic growth","Inflation theory","Trade theory","Consumer theory"],ans:"Stages of economic growth"},
    {q:"Dependency theory argues that:",options:["Poor countries are dependent on developed countries","Trade benefits all equally","All countries grow equally","Industrialization is unnecessary"],ans:"Poor countries are dependent on developed countries"},
    {q:"Human capital refers to:",options:["Machines","Money","Skills and education","Natural resources"],ans:"Skills and education"},
    {q:"Inclusive growth means:",options:["Growth for all sections of society","Growth only in cities","Export growth","Industrial growth only"],ans:"Growth for all sections of society"},
    {q:"Kuznets U hypothesis explains:",options:["Population growth","Income inequality during development","International trade","Inflation"],ans:"Income inequality during development"},
    {q:"Harrod-Domar model emphasizes:",options:["Savings and investment","Population control","Exports","Government taxes"],ans:"Savings and investment"},
    {q:"Solow growth model highlights the role of:",options:["Technology","Military power","Imports","Weather"],ans:"Technology"},
    {q:"Balanced growth means:",options:["Equal growth of all sectors","Growth only in agriculture","Decline in GDP","Increase in imports"],ans:"Equal growth of all sectors"},
    {q:"Inflation means:",options:["Fall in prices","Rise in prices","Stable economy","Reduction in GDP"],ans:"Rise in prices"},
    {q:"Per capita income means:",options:["Total national income","Income per person","Government revenue","Export earnings"],ans:"Income per person"},
    {q:"Vicious circle of poverty means:",options:["Rapid industrial growth","Poverty leading to more poverty","Export growth","Population decline"],ans:"Poverty leading to more poverty"},
    {q:"Big Push theory was proposed by:",options:["Rosenstein-Rodan","Keynes","Ricardo","Marshall"],ans:"Rosenstein-Rodan"},
    {q:"Unbalanced growth theory is associated with:",options:["Hirschman","Adam Smith","Friedman","Marx"],ans:"Hirschman"},
    {q:"Capability deprivation is related to:",options:["Amartya Sen","Milton Friedman","Ricardo","Pigou"],ans:"Amartya Sen"},
    {q:"Structural transformation means:",options:["Shift from agriculture to industry and services","Population growth","Inflation increase","Tax reduction"],ans:"Shift from agriculture to industry and services"},
    {q:"Dual economy model explains:",options:["Two political systems","Traditional and modern sectors","Two currencies","Export-import balance"],ans:"Traditional and modern sectors"},
    {q:"Disguised unemployment is common in:",options:["Agriculture","Banking","IT sector","Tourism"],ans:"Agriculture"},
    {q:"Lorenz curve measures:",options:["Economic growth","Income inequality","Population","Exports"],ans:"Income inequality"},
    {q:"Low level equilibrium trap is associated with:",options:["Nurkse","Keynes","Samuelson","Fisher"],ans:"Nurkse"},
];

let current = 0;
let selectedAnswers = new Array(questions.length).fill(null);
const storageKey = "devquiz";
const legacyProgressKey = "theoryProgress";

let savedIndex = localStorage.getItem(storageKey + "Current");
let savedAnswers = JSON.parse(localStorage.getItem(storageKey + "Answers"));

if (savedAnswers && savedAnswers.length === questions.length) selectedAnswers = savedAnswers;

if (savedIndex !== null) {
    current = Math.min(parseInt(savedIndex), questions.length - 1);
}

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const answerEl = document.getElementById("answer");
const progressEl = document.getElementById("progress");
const card = document.getElementById("card");
const navEl = document.querySelector(".nav");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

function getScore() {
    return selectedAnswers.reduce((score, answer, index) => {
        return answer === questions[index].ans ? score + 1 : score;
    }, 0);
}

function saveProgress() {
    const attempted = selectedAnswers.filter(answer => answer !== null).length;
    localStorage.setItem(storageKey + "Progress", attempted);
    localStorage.setItem(legacyProgressKey, attempted);
    localStorage.setItem(storageKey + "Current", current);
    localStorage.setItem(storageKey + "Answers", JSON.stringify(selectedAnswers));
}

function loadQuestion() {
    const q = questions[current];
    const selected = selectedAnswers[current];

    questionEl.innerText = q.q;
    answerEl.innerText = "Answer: " + q.ans;
    progressEl.innerText = "Question " + (current + 1) + "/" + questions.length;
    nextBtn.innerText = current === questions.length - 1 ? "Finish" : "Next";
    prevBtn.style.visibility = current === 0 ? "hidden" : "visible";
    navEl.classList.remove("results-nav");

    optionsEl.innerHTML = "";

    q.options.forEach(opt => {
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt;

        if (selected !== null) {
            if (opt === q.ans) div.classList.add("correct");
            if (opt === selected && selected !== q.ans) div.classList.add("wrong");
        }

        div.onclick = (e) => {
            e.stopPropagation();
            selectedAnswers[current] = opt;
            saveProgress();
            loadQuestion();
        };

        optionsEl.appendChild(div);
    });

    card.classList.remove("flip");
}

function showResults() {
    const correct = getScore();
    const wrong = questions.length - correct;
    const percent = Math.round((correct / questions.length) * 100);

    progressEl.innerText = "Quiz Complete";
    card.classList.remove("flip");
    card.innerHTML = [
        '<div class="result-card">',
        '<p class="result-label">Final Score</p>',
        '<h2>' + correct + '/' + questions.length + ' correct</h2>',
        '<div class="score-grid">',
        '<div class="score-pill correct-score"><strong>' + correct + '</strong><span>Correct</span></div>',
        '<div class="score-pill wrong-score"><strong>' + wrong + '</strong><span>Wrong</span></div>',
        '<div class="score-pill percent-score"><strong>' + percent + '%</strong><span>Score</span></div>',
        '</div>',
        '</div>'
    ].join('');
    navEl.classList.add("results-nav");
    prevBtn.style.visibility = "visible";
    prevBtn.innerText = "Review Quiz";
    nextBtn.innerText = "Try Again";
}

card.addEventListener("click", () => {
    if (card.querySelector(".card-inner")) {
        card.classList.toggle("flip");
    }
});

function nextQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        selectedAnswers = new Array(questions.length).fill(null);
        saveProgress();
        window.location.reload();
        return;
    }

    if (current < questions.length - 1) {
        current++;
        saveProgress();
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        saveProgress();
        window.location.reload();
        return;
    }

    if (current > 0) {
        current--;
        saveProgress();
        loadQuestion();
    }
}

function goBack() {
    window.location.href = "development.html";
}

loadQuestion();
</script>

</body>
</html>
