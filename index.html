<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLearn - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="login-card">
        <div class="logo">ðŸŽ“</div>
        
        <h1>Welcome to Ekon-Flashcards</h1>
        <p class="subtitle">Sign in to enter the world of economics</p>

        <div id="error-msg">Please fill in all fields.</div>

        <form id="loginForm">
            <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="student@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="sign-in-btn">Sign In</button>
        </form>
    </div>

    <script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('error-msg');

    loginForm.addEventListener('submit', function(event) {
        event.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (username.trim() !== "" && email.trim() !== "" && password.trim() !== "") {
            
            // Store user data
            localStorage.setItem("username", username);
            localStorage.setItem("userEmail", email);

            // Dummy dynamic stats
            localStorage.setItem("lessons", 149);
            localStorage.setItem("quizzes", 75);
            localStorage.setItem("points", 1250);

            window.location.href = "dashboard.html";
        } else {
            errorMsg.style.display = "block";
        }
    });
</script>

</body>
</html>
