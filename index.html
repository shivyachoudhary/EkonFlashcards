<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLearn - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f0f4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            color: #2563eb;
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            margin: 0 0 8px 0;
        }

        p.subtitle {
            font-size: 14px;
            color: #71717a;
            margin-bottom: 32px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #000;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid transparent;
            background-color: #f4f4f5;
            border-radius: 8px;
            font-size: 14px;
            color: #18181b;
            outline: none;
            transition: all 0.2s;
        }

        input::placeholder {
            color: #a1a1aa;
        }

        input:focus {
            background-color: #fff;
            border: 1px solid #2563eb;
        }

        .sign-in-btn {
            width: 100%;
            padding: 12px;
            background-color: #020617;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 12px;
        }

        .sign-in-btn:hover {
            background-color: #1e293b;
        }

        /* Error message style */
        #error-msg {
            color: #dc2626;
            font-size: 12px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">🎓</div>
        
        <h1>Welcome to Ekon-Flashcards</h1>
        <p class="subtitle">Sign in to enter the world of economics</p>

        <div id="error-msg">Please fill in all fields.</div>

        <form id="loginForm">
            <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="student@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="sign-in-btn">Sign In</button>
        </form>
    </div>

    <script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('error-msg');

    loginForm.addEventListener('submit', function(event) {
        event.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (username.trim() !== "" && email.trim() !== "" && password.trim() !== "") {
            
            // Store user data
            localStorage.setItem("username", username);
            localStorage.setItem("userEmail", email);

            // Dummy dynamic stats
            localStorage.setItem("lessons", 149);
            localStorage.setItem("quizzes", 75);
            localStorage.setItem("points", 1250);

            window.location.href = "dashboard.html";
        } else {
            errorMsg.style.display = "block";
        }
    });
</script>

</body>
</html>
