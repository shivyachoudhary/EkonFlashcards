<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EHI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="ehi.css">
</head>

<body>

<div class="header">
    <div class="back" onclick="goBack()">â† Back to Dashboard</div>
    <h1>Economic History Of India</h1>
    <p>Understanding the economic history of India</p>
</div>

<div class="container">

    <!-- THEORY MODULE -->
    <div class="module-card">
        <h3>Theory</h3>
        <p><span id="theoryDone">0</span> / <span id="theoryTotal">30</span> quizzes completed</p>

        <div class="progress-bar">
            <div id="theoryProgress" class="progress-fill"></div>
        </div>

        <button class="primary" onclick="openLesson()">Lesson</button>
        <button id="theoryQuizBtn" class="secondary" onclick="openQuiz()">Attempt Quiz</button>
    </div>

</div>

<script>

const TOTAL = 30;

// GET DATA
let theoryDone = parseInt(localStorage.getItem("theoryProgress")) || 0;

// BUTTON TEXT LOGIC
function getButtonText(progress) {
    if (progress === 0) return "Attempt Quiz";
    if (progress > 0 && progress < TOTAL) return "Continue Quiz";
    if (progress === TOTAL) return "Reattempt Quiz";
}

// UPDATE UI
function updateUI() {
    document.getElementById("theoryDone").innerText = theoryDone;
    document.getElementById("theoryTotal").innerText = TOTAL;

    let theoryPercent = (theoryDone / TOTAL) * 100;
    document.getElementById("theoryProgress").style.width = theoryPercent + "%";

    document.getElementById("theoryQuizBtn").innerText = getButtonText(theoryDone);
}

// QUIZ NAVIGATION
function openQuiz() {

    if (theoryDone === TOTAL) {
        localStorage.setItem("theoryProgress", 0);
        localStorage.removeItem("theoryAnswers");
        localStorage.setItem("theoryCurrent", 0);
    }

    window.location.href = "ehi-quiz.html";
}

// LESSON NAVIGATION
function openLesson() {
    window.location.href = "ehi-lesson.html";
}

// BACK
function goBack() {
    window.location.href = "dashboard.html";
}

// LOAD
window.onload = updateUI;

</script>

</body>
</html>
