<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theory Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="ehi-quiz.css">
</head>

<body>

<div class="top">
    <div class="back" onclick="goBack()">â† Back</div>
    <div id="progress">Question 1/10</div>
</div>

<div class="card" id="card">
    <div class="card-inner">
        <div class="card-front">
            <h3 id="question"></h3>
            <div id="options"></div>
        </div>
        <div class="card-back" id="answer"></div>
    </div>
</div>

<div class="nav">
    <button class="prev" onclick="prevQ()">Previous</button>
    <button class="next" onclick="nextQ()">Next</button>
</div>

<script>
const questions = [
    { q:"Economic history studies:",options:["Weather","Past economic systems","Biology","Astronomy"],ans:"Past economic systems"},
    { q:"Ancient Indian economy was mainly:",options:["Industrial","Agrarian","Digital","Service-based"],ans:"Agrarian"},
    { q:"Barter system means:",options:["Money exchange","Goods exchanged for goods","Banking","Tax collection"],ans:"Goods exchanged for goods"},
    { q:"Mughal economy mainly depended on:",options:["Mining","Land revenue","Tourism","Software"],ans:"Land revenue"},
    { q:"Drain of Wealth theory was given by:",options:["Adam Smith","Dadabhai Naoroji","Karl Marx","Keynes"],ans:"Dadabhai Naoroji"},
    { q:"Colonial economy mainly benefited:",options:["India","Britain","China","Japan"],ans:"Britain"},
    { q:"Deindustrialization means:",options:["Growth of industries","Decline of industries","Trade expansion","Urbanization"],ans:"Decline of industries"},
    { q:"Zamindari system used:",options:["Farmers","Intermediaries","Machines","Banks"],ans:"Intermediaries"},
    { q:"Ryotwari system was mainly introduced in:",options:["North India","South India","East India","West India"],ans:"South India"},
    { q:"Mahalwari system collected revenue from:",options:["Individuals","Villages","Factories","Banks"],ans:"Villages"},
    { q:"Commercialization of agriculture increased production of:",options:["Cash crops","Electronics","Machines","Software"],ans:"Cash crops"},
    { q:"Indian railways mainly improved:",options:["Transportation","Forests","Mining","Tourism"],ans:"Transportation"},
    { q:"Industrial Revolution began in:",options:["India","Britain","China","Japan"],ans:"Britain"},
    { q:"Industrial Revolution replaced:",options:["Machines with labor","Manual labor with machines","Factories with farms","Trade with farming"],ans:"Manual labor with machines"},
    { q:"British imports mainly affected Indian:",options:["Textile industry","Banking","IT sector","Education"],ans:"Textile industry"},
    { q:"Famines during colonial rule increased due to:",options:["Heavy rainfall","Poor policies","Industrial growth","Technology"],ans:"Poor policies"},
    { q:"Swadeshi Movement promoted:",options:["Foreign goods","Indian-made goods","Imports","Colonial trade"],ans:"Indian-made goods"},
    { q:"Five-Year Plans started after:",options:["Colonial rule","Independence","Industrial Revolution","Partition"],ans:"Independence"},
    { q:"India adopted which economic system after independence?",options:["Capitalist","Mixed economy","Communist","Feudal"],ans:"Mixed economy"},
    { q:"Green Revolution increased:",options:["Industrial output","Agricultural productivity","Imports","Taxes"],ans:"Agricultural productivity"},
    { q:"Economic reforms in India were introduced in:",options:["1947","1965","1991","2001"],ans:"1991"},
    { q:"Liberalization means:",options:["More government control","Reduction in government control","Agricultural reform","Military growth"],ans:"Reduction in government control"},
    { q:"Globalization increases:",options:["Isolation","International trade","Barter","Localism"],ans:"International trade"},
    { q:"Privatization transfers ownership to:",options:["Government","Private sector","Villages","Foreign armies"],ans:"Private sector"},
    { q:"Cotton textile industry mainly developed in:",options:["Delhi","Mumbai","Chennai","Lucknow"],ans:"Mumbai"},
    { q:"Jute industry mainly developed in:",options:["Punjab","Bengal","Gujarat","Kerala"],ans:"Bengal"},
    { q:"Handloom industry mainly employed:",options:["Engineers","Artisans and weavers","Doctors","Scientists"],ans:"Artisans and weavers"},
    { q:"Industrialization mainly increases:",options:["Production","Illiteracy","Poverty","Barter trade"],ans:"Production"},
    { q:"Agriculture provides:",options:["Food and employment","Only exports","Only taxes","Only machinery"],ans:"Food and employment"},
    { q:"Economic development improves:",options:["Only GDP","Living standards","Only exports","Only taxation"],ans:"Living standards"}
];

let current = 0;
let selectedAnswers = new Array(questions.length).fill(null);
const storageKey = "ehiquiz";
const legacyProgressKey = "theoryProgress";

let savedIndex = localStorage.getItem(storageKey + "Current");
let savedAnswers = JSON.parse(localStorage.getItem(storageKey + "Answers"));

if (savedAnswers && savedAnswers.length === questions.length) selectedAnswers = savedAnswers;

if (savedIndex !== null) {
    current = Math.min(parseInt(savedIndex), questions.length - 1);
}

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const answerEl = document.getElementById("answer");
const progressEl = document.getElementById("progress");
const card = document.getElementById("card");
const navEl = document.querySelector(".nav");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

function getScore() {
    return selectedAnswers.reduce((score, answer, index) => {
        return answer === questions[index].ans ? score + 1 : score;
    }, 0);
}

function saveProgress() {
    const attempted = selectedAnswers.filter(answer => answer !== null).length;
    localStorage.setItem(storageKey + "Progress", attempted);
    localStorage.setItem(legacyProgressKey, attempted);
    localStorage.setItem(storageKey + "Current", current);
    localStorage.setItem(storageKey + "Answers", JSON.stringify(selectedAnswers));
}

function loadQuestion() {
    const q = questions[current];
    const selected = selectedAnswers[current];

    questionEl.innerText = q.q;
    answerEl.innerText = "Answer: " + q.ans;
    progressEl.innerText = "Question " + (current + 1) + "/" + questions.length;
    nextBtn.innerText = current === questions.length - 1 ? "Finish" : "Next";
    prevBtn.style.visibility = current === 0 ? "hidden" : "visible";
    navEl.classList.remove("results-nav");

    optionsEl.innerHTML = "";

    q.options.forEach(opt => {
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt;

        if (selected !== null) {
            if (opt === q.ans) div.classList.add("correct");
            if (opt === selected && selected !== q.ans) div.classList.add("wrong");
        }

        div.onclick = (e) => {
            e.stopPropagation();
            selectedAnswers[current] = opt;
            saveProgress();
            loadQuestion();
        };

        optionsEl.appendChild(div);
    });

    card.classList.remove("flip");
}

function showResults() {
    const correct = getScore();
    const wrong = questions.length - correct;
    const percent = Math.round((correct / questions.length) * 100);

    progressEl.innerText = "Quiz Complete";
    card.classList.remove("flip");
    card.innerHTML = [
        '<div class="result-card">',
        '<p class="result-label">Final Score</p>',
        '<h2>' + correct + '/' + questions.length + ' correct</h2>',
        '<div class="score-grid">',
        '<div class="score-pill correct-score"><strong>' + correct + '</strong><span>Correct</span></div>',
        '<div class="score-pill wrong-score"><strong>' + wrong + '</strong><span>Wrong</span></div>',
        '<div class="score-pill percent-score"><strong>' + percent + '%</strong><span>Score</span></div>',
        '</div>',
        '</div>'
    ].join('');
    navEl.classList.add("results-nav");
    prevBtn.style.visibility = "visible";
    prevBtn.innerText = "Review Quiz";
    nextBtn.innerText = "Try Again";
}

card.addEventListener("click", () => {
    if (card.querySelector(".card-inner")) {
        card.classList.toggle("flip");
    }
});

function nextQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        selectedAnswers = new Array(questions.length).fill(null);
        saveProgress();
        window.location.reload();
        return;
    }

    if (current < questions.length - 1) {
        current++;
        saveProgress();
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        saveProgress();
        window.location.reload();
        return;
    }

    if (current > 0) {
        current--;
        saveProgress();
        loadQuestion();
    }
}

function goBack() {
    window.location.href = "ehi.html";
}

loadQuestion();
</script>

</body>
</html>
