<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theory Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="stats-theory-quiz.css">
</head>

<body>

<div class="top">
    <div class="back" onclick="goBack()">â† Back</div>
    <div id="progress">Question 1/10</div>
</div>

<div class="card" id="card">
    <div class="card-inner">
        <div class="card-front">
            <h3 id="question"></h3>
            <div id="options"></div>
        </div>
        <div class="card-back" id="answer"></div>
    </div>
</div>

<div class="nav">
    <button class="prev" onclick="prevQ()">Previous</button>
    <button class="next" onclick="nextQ()">Next</button>
</div>

<script>
const questions = [
    {q:"Statistics is mainly concerned with:",options:["Designing websites","Collecting and analyzing data","Studying history","Writing essays"],ans:"Collecting and analyzing data"},
    {q:"Which of the following is an example of descriptive statistics?",options:["Predicting election results","Calculating average income","Testing hypothesis","Estimating population"],ans:"Calculating average income"},
    {q:"Inferential statistics is used to:",options:["Summarize data only","Draw conclusions from samples","Create graphs only","Organize tables"],ans:"Draw conclusions from samples"},
    {q:"Which of the following is secondary data?",options:["Personal survey","Interview","Government census report","Experiment"],ans:"Government census report"},
    {q:"Which of the following is a qualitative variable?",options:["Income","Age","Occupation","Height"],ans:"Occupation"},
    {q:"Which of the following is a quantitative variable?",options:["Gender","Religion","Income","Nationality"],ans:"Income"},
    {q:"Which of the following is a discrete variable?",options:["Height","Weight","Number of students","Temperature"],ans:"Number of students"},
    {q:"Which of the following is a continuous variable?",options:["Number of books","Income","Number of cars","Number of students"],ans:"Income"},
    {q:"The mean represents:",options:["Middle value","Average value","Most frequent value","Maximum value"],ans:"Average value"},
    {q:"The middle value of ordered data is called:",options:["Mean","Median","Mode","Range"],ans:"Median"},
    {q:"The most frequently occurring value is called:",options:["Mean","Median","Mode","Variance"],ans:"Mode"},
    {q:"Range is calculated as:",options:["Maximum âˆ’ Minimum","Mean âˆ’ Median","Variance Ã· Mean","Mode âˆ’ Median"],ans:"Maximum âˆ’ Minimum"},
    {q:"Variance measures:",options:["Average squared deviation from mean","Middle value","Most common value","Probability"],ans:"Average squared deviation from mean"},
    {q:"Standard deviation is:",options:["Square of variance","Square root of variance","Middle value","Probability"],ans:"Square root of variance"},
    {q:"Probability values always lie between:",options:["âˆ’1 and 1","0 and 1","0 and 10","1 and 10"],ans:"0 and 1"},
    {q:"Probability of getting heads in one coin toss is:",options:["1","1/2","1/3","2"],ans:"1/2"},
    {q:"Conditional probability means:",options:["Probability without condition","Probability given another event","Impossible event","Equal outcomes"],ans:"Probability given another event"},
    {q:"Bayesâ€™ theorem is mainly used to:",options:["Calculate mean","Update probability using new information","Find variance","Find mode"],ans:"Update probability using new information"},
    {q:"A random variable represents:",options:["Fixed value","Numerical outcome of random experiment","Constant parameter","Equation"],ans:"Numerical outcome of random experiment"},
    {q:"Which of the following is a discrete random variable?",options:["Income","Height","Number of defective products","Weight"],ans:"Number of defective products"},
    {q:"Which of the following is a continuous random variable?",options:["Number of books","Height","Number of students","Number of cars"],ans:"Height"},
    {q:"PMF is used for:",options:["Continuous variables","Discrete variables","Qualitative variables","Both"],ans:"Discrete variables"},
    {q:"PDF is used for:",options:["Discrete variables","Continuous variables","Qualitative variables","Binary variables"],ans:"Continuous variables"},
    {q:"CDF gives:",options:["Exact probability","Cumulative probability","Average value","Spread of data"],ans:"Cumulative probability"},
    {q:"Which distribution has only two outcomes?",options:["Poisson","Bernoulli","Normal","Uniform"],ans:"Bernoulli"},
    {q:"Which distribution measures number of successes in repeated trials?",options:["Bernoulli","Binomial","Poisson","Geometric"],ans:"Binomial"},
    {q:"Which distribution is used when sampling is done without replacement?",options:["Binomial","Hypergeometric","Normal","Poisson"],ans:"Hypergeometric"},
    {q:"Which distribution models number of events in a fixed interval?",options:["Uniform","Poisson","Normal","Geometric"],ans:"Poisson"},
    {q:"Which distribution is bell-shaped and symmetric?",options:["Poisson","Normal","Geometric","Hypergeometric"],ans:"Normal"},
    {q:"Sampling means:",options:["Studying whole population","Selecting subset from population","Ignoring data","Creating new data"],ans:"Selecting subset from population"}
];

let current = 0;
let selectedAnswers = new Array(questions.length).fill(null);
const storageKey = "statstheoryquiz";
const legacyProgressKey = "theoryProgress";

let savedIndex = localStorage.getItem(storageKey + "Current");
let savedAnswers = JSON.parse(localStorage.getItem(storageKey + "Answers"));

if (savedAnswers && savedAnswers.length === questions.length) selectedAnswers = savedAnswers;

if (savedIndex !== null) {
    current = Math.min(parseInt(savedIndex), questions.length - 1);
}

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const answerEl = document.getElementById("answer");
const progressEl = document.getElementById("progress");
const card = document.getElementById("card");
const navEl = document.querySelector(".nav");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

function getScore() {
    return selectedAnswers.reduce((score, answer, index) => {
        return answer === questions[index].ans ? score + 1 : score;
    }, 0);
}

function saveProgress() {
    const attempted = selectedAnswers.filter(answer => answer !== null).length;
    localStorage.setItem(storageKey + "Progress", attempted);
    localStorage.setItem(legacyProgressKey, attempted);
    localStorage.setItem(storageKey + "Current", current);
    localStorage.setItem(storageKey + "Answers", JSON.stringify(selectedAnswers));
}

function loadQuestion() {
    const q = questions[current];
    const selected = selectedAnswers[current];

    questionEl.innerText = q.q;
    answerEl.innerText = "Answer: " + q.ans;
    progressEl.innerText = "Question " + (current + 1) + "/" + questions.length;
    nextBtn.innerText = current === questions.length - 1 ? "Finish" : "Next";
    prevBtn.style.visibility = current === 0 ? "hidden" : "visible";
    navEl.classList.remove("results-nav");

    optionsEl.innerHTML = "";

    q.options.forEach(opt => {
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt;

        if (selected !== null) {
            if (opt === q.ans) div.classList.add("correct");
            if (opt === selected && selected !== q.ans) div.classList.add("wrong");
        }

        div.onclick = (e) => {
            e.stopPropagation();
            selectedAnswers[current] = opt;
            saveProgress();
            loadQuestion();
        };

        optionsEl.appendChild(div);
    });

    card.classList.remove("flip");
}

function showResults() {
    const correct = getScore();
    const wrong = questions.length - correct;
    const percent = Math.round((correct / questions.length) * 100);

    progressEl.innerText = "Quiz Complete";
    card.classList.remove("flip");
    card.innerHTML = [
        '<div class="result-card">',
        '<p class="result-label">Final Score</p>',
        '<h2>' + correct + '/' + questions.length + ' correct</h2>',
        '<div class="score-grid">',
        '<div class="score-pill correct-score"><strong>' + correct + '</strong><span>Correct</span></div>',
        '<div class="score-pill wrong-score"><strong>' + wrong + '</strong><span>Wrong</span></div>',
        '<div class="score-pill percent-score"><strong>' + percent + '%</strong><span>Score</span></div>',
        '</div>',
        '</div>'
    ].join('');
    navEl.classList.add("results-nav");
    prevBtn.style.visibility = "visible";
    prevBtn.innerText = "Review Quiz";
    nextBtn.innerText = "Try Again";
}

card.addEventListener("click", () => {
    if (card.querySelector(".card-inner")) {
        card.classList.toggle("flip");
    }
});

function nextQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        selectedAnswers = new Array(questions.length).fill(null);
        saveProgress();
        window.location.reload();
        return;
    }

    if (current < questions.length - 1) {
        current++;
        saveProgress();
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        saveProgress();
        window.location.reload();
        return;
    }

    if (current > 0) {
        current--;
        saveProgress();
        loadQuestion();
    }
}

function goBack() {
    window.location.href = "statistics.html";
}

loadQuestion();
</script>

</body>
</html>
