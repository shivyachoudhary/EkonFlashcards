<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphs Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="macro-graphs-quiz.css">
</head>

<body>

<div class="top">
    <div class="back" onclick="goBack()">â† Back</div>
    <div id="progress">Question 1/30</div>
</div>

<div class="card" id="card">
    <div class="card-inner">
        <div class="card-front">
            <h3 id="question"></h3>
            <div id="options"></div>
        </div>
        <div class="card-back" id="answer"></div>
    </div>
</div>

<div class="nav">
    <button class="prev" onclick="prevQ()">Previous</button>
    <button class="next" onclick="nextQ()">Next</button>
</div>

<script>
const questions = [
    { q: "Slope of demand curve?", options: ["Positive","Negative","Zero","Infinite"], ans: "Negative" },
    { q: "Slope of supply curve?", options: ["Negative","Positive","Zero","None"], ans: "Positive" },
    { q: "Equilibrium occurs where?", options: ["Demand only","Supply only","Intersection","None"], ans: "Intersection" },
    { q: "Rightward shift in demand?", options: ["Decrease","Increase","No change","Fall"], ans: "Increase" },
    { q: "Leftward shift in supply?", options: ["Increase","Decrease","No change","Rise"], ans: "Decrease" },
    { q: "X-axis shows?", options: ["Price","Quantity","Demand","Supply"], ans: "Quantity" },
    { q: "Y-axis shows?", options: ["Quantity","Price","Demand","Supply"], ans: "Price" },
    { q: "Elastic demand?", options: ["Less responsive","Highly responsive","Zero","Constant"], ans: "Highly responsive" },
    { q: "Inelastic demand?", options: ["Highly responsive","Less responsive","Infinite","Zero"], ans: "Less responsive" },
    { q: "Parallel shift means?", options: ["Movement","Shift","Equilibrium","None"], ans: "Shift" },
    { q: "Slope of demand curve?", options: ["Positive","Negative","Zero","Infinite"], ans: "Negative" },
    { q: "Slope of supply curve?", options: ["Negative","Positive","Zero","None"], ans: "Positive" },
    { q: "Equilibrium occurs where?", options: ["Demand only","Supply only","Intersection","None"], ans: "Intersection" },
    { q: "Rightward shift in demand?", options: ["Decrease","Increase","No change","Fall"], ans: "Increase" },
    { q: "Leftward shift in supply?", options: ["Increase","Decrease","No change","Rise"], ans: "Decrease" },
    { q: "X-axis shows?", options: ["Price","Quantity","Demand","Supply"], ans: "Quantity" },
    { q: "Y-axis shows?", options: ["Quantity","Price","Demand","Supply"], ans: "Price" },
    { q: "Elastic demand?", options: ["Less responsive","Highly responsive","Zero","Constant"], ans: "Highly responsive" },
    { q: "Inelastic demand?", options: ["Highly responsive","Less responsive","Infinite","Zero"], ans: "Less responsive" },
    { q: "Parallel shift means?", options: ["Movement","Shift","Equilibrium","None"], ans: "Shift" },
    { q: "Slope of demand curve?", options: ["Positive","Negative","Zero","Infinite"], ans: "Negative" },
    { q: "Slope of supply curve?", options: ["Negative","Positive","Zero","None"], ans: "Positive" },
    { q: "Equilibrium occurs where?", options: ["Demand only","Supply only","Intersection","None"], ans: "Intersection" },
    { q: "Rightward shift in demand?", options: ["Decrease","Increase","No change","Fall"], ans: "Increase" },
    { q: "Leftward shift in supply?", options: ["Increase","Decrease","No change","Rise"], ans: "Decrease" },
    { q: "X-axis shows?", options: ["Price","Quantity","Demand","Supply"], ans: "Quantity" },
    { q: "Y-axis shows?", options: ["Quantity","Price","Demand","Supply"], ans: "Price" },
    { q: "Elastic demand?", options: ["Less responsive","Highly responsive","Zero","Constant"], ans: "Highly responsive" },
    { q: "Inelastic demand?", options: ["Highly responsive","Less responsive","Infinite","Zero"], ans: "Less responsive" },
    { q: "Parallel shift means?", options: ["Movement","Shift","Equilibrium","None"], ans: "Shift" }
];

let current = 0;
let selectedAnswers = new Array(questions.length).fill(null);
const storageKey = "macrographsquiz";
const legacyProgressKey = "graphsProgress";

let savedIndex = localStorage.getItem(storageKey + "Current");
let savedAnswers = JSON.parse(localStorage.getItem(storageKey + "Answers"));

if (savedAnswers && savedAnswers.length === questions.length) selectedAnswers = savedAnswers;

if (savedIndex !== null) {
    current = Math.min(parseInt(savedIndex), questions.length - 1);
}

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const answerEl = document.getElementById("answer");
const progressEl = document.getElementById("progress");
const card = document.getElementById("card");
const navEl = document.querySelector(".nav");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

function getScore() {
    return selectedAnswers.reduce((score, answer, index) => {
        return answer === questions[index].ans ? score + 1 : score;
    }, 0);
}

function saveProgress() {
    const attempted = selectedAnswers.filter(answer => answer !== null).length;
    localStorage.setItem(storageKey + "Progress", attempted);
    localStorage.setItem(legacyProgressKey, attempted);
    localStorage.setItem(storageKey + "Current", current);
    localStorage.setItem(storageKey + "Answers", JSON.stringify(selectedAnswers));
}

function loadQuestion() {
    const q = questions[current];
    const selected = selectedAnswers[current];

    questionEl.innerText = q.q;
    answerEl.innerText = "Answer: " + q.ans;
    progressEl.innerText = "Question " + (current + 1) + "/" + questions.length;
    nextBtn.innerText = current === questions.length - 1 ? "Finish" : "Next";
    prevBtn.style.visibility = current === 0 ? "hidden" : "visible";
    navEl.classList.remove("results-nav");

    optionsEl.innerHTML = "";

    q.options.forEach(opt => {
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt;

        if (selected !== null) {
            if (opt === q.ans) div.classList.add("correct");
            if (opt === selected && selected !== q.ans) div.classList.add("wrong");
        }

        div.onclick = (e) => {
            e.stopPropagation();
            selectedAnswers[current] = opt;
            saveProgress();
            loadQuestion();
        };

        optionsEl.appendChild(div);
    });

    card.classList.remove("flip");
}

function showResults() {
    const correct = getScore();
    const wrong = questions.length - correct;
    const percent = Math.round((correct / questions.length) * 100);

    progressEl.innerText = "Quiz Complete";
    card.classList.remove("flip");
    card.innerHTML = [
        '<div class="result-card">',
        '<p class="result-label">Final Score</p>',
        '<h2>' + correct + '/' + questions.length + ' correct</h2>',
        '<div class="score-grid">',
        '<div class="score-pill correct-score"><strong>' + correct + '</strong><span>Correct</span></div>',
        '<div class="score-pill wrong-score"><strong>' + wrong + '</strong><span>Wrong</span></div>',
        '<div class="score-pill percent-score"><strong>' + percent + '%</strong><span>Score</span></div>',
        '</div>',
        '</div>'
    ].join('');
    navEl.classList.add("results-nav");
    prevBtn.style.visibility = "visible";
    prevBtn.innerText = "Review Quiz";
    nextBtn.innerText = "Try Again";
}

card.addEventListener("click", () => {
    if (card.querySelector(".card-inner")) {
        card.classList.toggle("flip");
    }
});

function nextQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        selectedAnswers = new Array(questions.length).fill(null);
        saveProgress();
        window.location.reload();
        return;
    }

    if (current < questions.length - 1) {
        current++;
        saveProgress();
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        saveProgress();
        window.location.reload();
        return;
    }

    if (current > 0) {
        current--;
        saveProgress();
        loadQuestion();
    }
}

function goBack() {
    window.location.href = "macroeconomics.html";
}

loadQuestion();
</script>

</body>
</html>
