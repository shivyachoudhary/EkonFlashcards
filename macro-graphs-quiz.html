<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphs Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="macro-graphs-quiz.css">
</head>

<body>

<div class="top">
    <div class="back" onclick="goBack()">â† Back</div>
    <div id="progress">Question 1/30</div>
</div>

<div class="card" id="card">
    <div class="card-inner">
        <div class="card-front">
            <h3 id="question"></h3>
            <div id="options"></div>
        </div>
        <div class="card-back" id="answer"></div>
    </div>
</div>

<div class="nav">
    <button class="prev" onclick="prevQ()">Previous</button>
    <button class="next" onclick="nextQ()">Next</button>
</div>

<script>
const questions = [
    {q:"Classical economists believed economy is:",options:["Unstable","Self-adjusting","Government-controlled","Closed"],ans:"Self-adjusting"},
{q:"Say’s Law states:",options:["Demand creates supply","Supply creates its own demand","Money creates inflation","Taxes create demand"],ans:"Supply creates its own demand"},
{q:"Keynesian economics emphasizes:",options:["Aggregate demand","Aggregate supply","Exports","Imports"],ans:"Aggregate demand"},
{q:"Keynes believed unemployment occurs due to:",options:["High wages","Insufficient demand","Low taxes","Exports"],ans:"Insufficient demand"},
{q:"Monetarism was mainly developed by:",options:["Keynes","Milton Friedman","Adam Smith","Ricardo"],ans:"Milton Friedman"},
{q:"Monetarists believe inflation is mainly caused by:",options:["Low exports","Excess money supply","Imports","Taxes"],ans:"Excess money supply"},
{q:"New classical economics emphasizes:",options:["Sticky prices","Rational expectations","Government control","Barter"],ans:"Rational expectations"},
{q:"Rational expectations means people use:",options:["Random guesses","Past data only","All available information","Government orders"],ans:"All available information"},
{q:"New Keynesian economics focuses on:",options:["Flexible prices","Sticky wages and prices","No unemployment","Perfect markets"],ans:"Sticky wages and prices"},
{q:"Efficiency wage theory suggests firms pay:",options:["Low wages","Equilibrium wages only","Higher wages for productivity","No wages"],ans:"Higher wages for productivity"},
{q:"Phillips Curve shows relation between:",options:["Inflation and unemployment","GDP and exports","Savings and taxes","Imports and exports"],ans:"Inflation and unemployment"},
{q:"Keynesian Phillips Curve suggests:",options:["No trade-off","Stable trade-off","Vertical curve","Horizontal curve"],ans:"Stable trade-off"},
{q:"Monetarists argued long-run Phillips Curve is:",options:["Horizontal","Vertical","Downward","Circular"],ans:"Vertical"},
{q:"Natural rate of unemployment includes:",options:["Frictional and structural unemployment","Only cyclical unemployment","No unemployment","Seasonal unemployment only"],ans:"Frictional and structural unemployment"},
{q:"New classical economists believe policies are:",options:["Always effective","Mostly ineffective if anticipated","Useful only in agriculture","Irrelevant"],ans:"Mostly ineffective if anticipated"},
{q:"Sticky prices mean prices:",options:["Change instantly","Adjust slowly","Never change","Rise continuously"],ans:"Adjust slowly"},
{q:"Sticky wages can create:",options:["Inflation only","Unemployment","Exports","Imports"],ans:"Unemployment"},
{q:"Post Keynesian economists emphasize:",options:["Uncertainty","Perfect competition","No government","Barter"],ans:"Uncertainty"},
{q:"Post Keynesians believe money is:",options:["Exogenous only","Endogenous","Useless","Fixed"],ans:"Endogenous"},
{q:"Labor demand comes from:",options:["Government","Demand for goods","Exports","Imports"],ans:"Demand for goods"},
{q:"Labor supply depends mainly on:",options:["Wages","Exports","Imports","Technology"],ans:"Wages"},
{q:"Labor market equilibrium occurs where:",options:["Inflation equals unemployment","Labor demand equals labor supply","GDP equals GNP","Exports equal imports"],ans:"Labor demand equals labor supply"},
{q:"Real wage measures:",options:["Money supply","Purchasing power of wages","Exports","Taxes"],ans:"Purchasing power of wages"},
{q:"Adaptive expectations are based on:",options:["Future guesses","Past experiences","Government policy only","Exports"],ans:"Past experiences"},
{q:"Keynesian economics supports:",options:["No government intervention","Government intervention","Only exports","Only imports"],ans:"Government intervention"},
{q:"Multiplier effect means:",options:["Prices rise continuously","Income rises by larger amount","Taxes increase","Imports increase"],ans:"Income rises by larger amount"},
{q:"Quantity theory of money links money supply with:",options:["Inflation","Exports","Agriculture","Population"],ans:"Inflation"},
{q:"Fiscal policy mainly uses:",options:["Taxes and government spending","Imports","Exports","Wages"],ans:"Taxes and government spending"},
{q:"Monetary policy mainly controls:",options:["Population","Money supply and interest rates","Exports","Agriculture"],ans:"Money supply and interest rates"},
{q:"New Keynesian Phillips Curve includes:",options:["Sticky prices and expectations","Only exports","Only labor supply","Only taxes"],ans:"Sticky prices and expectations"}
];

let current = 0;
let selectedAnswers = new Array(questions.length).fill(null);
const storageKey = "macrographsquiz";
const legacyProgressKey = "graphsProgress";

let savedIndex = localStorage.getItem(storageKey + "Current");
let savedAnswers = JSON.parse(localStorage.getItem(storageKey + "Answers"));

if (savedAnswers && savedAnswers.length === questions.length) selectedAnswers = savedAnswers;

if (savedIndex !== null) {
    current = Math.min(parseInt(savedIndex), questions.length - 1);
}

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const answerEl = document.getElementById("answer");
const progressEl = document.getElementById("progress");
const card = document.getElementById("card");
const navEl = document.querySelector(".nav");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

function getScore() {
    return selectedAnswers.reduce((score, answer, index) => {
        return answer === questions[index].ans ? score + 1 : score;
    }, 0);
}

function saveProgress() {
    const attempted = selectedAnswers.filter(answer => answer !== null).length;
    localStorage.setItem(storageKey + "Progress", attempted);
    localStorage.setItem(legacyProgressKey, attempted);
    localStorage.setItem(storageKey + "Current", current);
    localStorage.setItem(storageKey + "Answers", JSON.stringify(selectedAnswers));
}

function loadQuestion() {
    const q = questions[current];
    const selected = selectedAnswers[current];

    questionEl.innerText = q.q;
    answerEl.innerText = "Answer: " + q.ans;
    progressEl.innerText = "Question " + (current + 1) + "/" + questions.length;
    nextBtn.innerText = current === questions.length - 1 ? "Finish" : "Next";
    prevBtn.style.visibility = current === 0 ? "hidden" : "visible";
    navEl.classList.remove("results-nav");

    optionsEl.innerHTML = "";

    q.options.forEach(opt => {
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt;

        if (selected !== null) {
            if (opt === q.ans) div.classList.add("correct");
            if (opt === selected && selected !== q.ans) div.classList.add("wrong");
        }

        div.onclick = (e) => {
            e.stopPropagation();
            selectedAnswers[current] = opt;
            saveProgress();
            loadQuestion();
        };

        optionsEl.appendChild(div);
    });

    card.classList.remove("flip");
}

function showResults() {
    const correct = getScore();
    const wrong = questions.length - correct;
    const percent = Math.round((correct / questions.length) * 100);

    progressEl.innerText = "Quiz Complete";
    card.classList.remove("flip");
    card.innerHTML = [
        '<div class="result-card">',
        '<p class="result-label">Final Score</p>',
        '<h2>' + correct + '/' + questions.length + ' correct</h2>',
        '<div class="score-grid">',
        '<div class="score-pill correct-score"><strong>' + correct + '</strong><span>Correct</span></div>',
        '<div class="score-pill wrong-score"><strong>' + wrong + '</strong><span>Wrong</span></div>',
        '<div class="score-pill percent-score"><strong>' + percent + '%</strong><span>Score</span></div>',
        '</div>',
        '</div>'
    ].join('');
    navEl.classList.add("results-nav");
    prevBtn.style.visibility = "visible";
    prevBtn.innerText = "Review Quiz";
    nextBtn.innerText = "Try Again";
}

card.addEventListener("click", () => {
    if (card.querySelector(".card-inner")) {
        card.classList.toggle("flip");
    }
});

function nextQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        selectedAnswers = new Array(questions.length).fill(null);
        saveProgress();
        window.location.reload();
        return;
    }

    if (current < questions.length - 1) {
        current++;
        saveProgress();
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        saveProgress();
        window.location.reload();
        return;
    }

    if (current > 0) {
        current--;
        saveProgress();
        loadQuestion();
    }
}

function goBack() {
    window.location.href = "macroeconomics.html";
}

loadQuestion();
</script>

</body>
</html>
