<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theory Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="micro-theory-quiz.css">
</head>

<body>

<div class="top">
    <div class="back" onclick="goBack()">â† Back</div>
    <div id="progress">Question 1/10</div>
</div>

<div class="card" id="card">
    <div class="card-inner">
        <div class="card-front">
            <h3 id="question"></h3>
            <div id="options"></div>
        </div>
        <div class="card-back" id="answer"></div>
    </div>
</div>

<div class="nav">
    <button class="prev" onclick="prevQ()">Previous</button>
    <button class="next" onclick="nextQ()">Next</button>
</div>

<script>
const questions = [
    { q: "What is GDP?", options: ["Total goods produced","National income","Gov spending","Exports"], ans: "Total goods produced" },
    { q: "Inflation means?", options: ["Rise in prices","Fall in prices","Stable","No change"], ans: "Rise in prices" },
    { q: "Who controls money supply?", options: ["Gov","Central Bank","Firms","People"], ans: "Central Bank" },
    { q: "Fiscal policy refers to?", options: ["Interest rates","Gov spending","Trade","Population"], ans: "Gov spending" },
    { q: "Unemployment means?", options: ["No jobs","People without jobs","Low wages","Retired"], ans: "People without jobs" },
    { q: "Demand increases when?", options: ["Price rises","Income rises","Supply rises","Tax rises"], ans: "Income rises" },
    { q: "Law of supply states?", options: ["Inverse relation","Direct relation","No relation","Random"], ans: "Direct relation" },
    { q: "Opportunity cost is?", options: ["Next best alternative","Money cost","Loss","Production cost"], ans: "Next best alternative" },
    { q: "Microeconomics studies?", options: ["Whole economy","Individual units","Gov","Trade"], ans: "Individual units" },
    { q: "Macroeconomics studies?", options: ["Firms","Markets","Entire economy","Consumers"], ans: "Entire economy" },
    { q: "What is GDP?", options: ["Total goods produced","National income","Gov spending","Exports"], ans: "Total goods produced" },
    { q: "Inflation means?", options: ["Rise in prices","Fall in prices","Stable","No change"], ans: "Rise in prices" },
    { q: "Who controls money supply?", options: ["Gov","Central Bank","Firms","People"], ans: "Central Bank" },
    { q: "Fiscal policy refers to?", options: ["Interest rates","Gov spending","Trade","Population"], ans: "Gov spending" },
    { q: "Unemployment means?", options: ["No jobs","People without jobs","Low wages","Retired"], ans: "People without jobs" },
    { q: "Demand increases when?", options: ["Price rises","Income rises","Supply rises","Tax rises"], ans: "Income rises" },
    { q: "Law of supply states?", options: ["Inverse relation","Direct relation","No relation","Random"], ans: "Direct relation" },
    { q: "Opportunity cost is?", options: ["Next best alternative","Money cost","Loss","Production cost"], ans: "Next best alternative" },
    { q: "Microeconomics studies?", options: ["Whole economy","Individual units","Gov","Trade"], ans: "Individual units" },
    { q: "Macroeconomics studies?", options: ["Firms","Markets","Entire economy","Consumers"], ans: "Entire economy" },
    { q: "What is GDP?", options: ["Total goods produced","National income","Gov spending","Exports"], ans: "Total goods produced" },
    { q: "Inflation means?", options: ["Rise in prices","Fall in prices","Stable","No change"], ans: "Rise in prices" },
    { q: "Who controls money supply?", options: ["Gov","Central Bank","Firms","People"], ans: "Central Bank" },
    { q: "Fiscal policy refers to?", options: ["Interest rates","Gov spending","Trade","Population"], ans: "Gov spending" },
    { q: "Unemployment means?", options: ["No jobs","People without jobs","Low wages","Retired"], ans: "People without jobs" },
    { q: "Demand increases when?", options: ["Price rises","Income rises","Supply rises","Tax rises"], ans: "Income rises" },
    { q: "Law of supply states?", options: ["Inverse relation","Direct relation","No relation","Random"], ans: "Direct relation" },
    { q: "Opportunity cost is?", options: ["Next best alternative","Money cost","Loss","Production cost"], ans: "Next best alternative" },
    { q: "Microeconomics studies?", options: ["Whole economy","Individual units","Gov","Trade"], ans: "Individual units" },
    { q: "Macroeconomics studies?", options: ["Firms","Markets","Entire economy","Consumers"], ans: "Entire economy" }
];

let current = 0;
let selectedAnswers = new Array(questions.length).fill(null);
const storageKey = "microtheoryquiz";
const legacyProgressKey = "theoryProgress";

let savedIndex = localStorage.getItem(storageKey + "Current");
let savedAnswers = JSON.parse(localStorage.getItem(storageKey + "Answers"));

if (savedAnswers && savedAnswers.length === questions.length) selectedAnswers = savedAnswers;

if (savedIndex !== null) {
    current = Math.min(parseInt(savedIndex), questions.length - 1);
}

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const answerEl = document.getElementById("answer");
const progressEl = document.getElementById("progress");
const card = document.getElementById("card");
const navEl = document.querySelector(".nav");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

function getScore() {
    return selectedAnswers.reduce((score, answer, index) => {
        return answer === questions[index].ans ? score + 1 : score;
    }, 0);
}

function saveProgress() {
    const attempted = selectedAnswers.filter(answer => answer !== null).length;
    localStorage.setItem(storageKey + "Progress", attempted);
    localStorage.setItem(legacyProgressKey, attempted);
    localStorage.setItem(storageKey + "Current", current);
    localStorage.setItem(storageKey + "Answers", JSON.stringify(selectedAnswers));
}

function loadQuestion() {
    const q = questions[current];
    const selected = selectedAnswers[current];

    questionEl.innerText = q.q;
    answerEl.innerText = "Answer: " + q.ans;
    progressEl.innerText = "Question " + (current + 1) + "/" + questions.length;
    nextBtn.innerText = current === questions.length - 1 ? "Finish" : "Next";
    prevBtn.style.visibility = current === 0 ? "hidden" : "visible";
    navEl.classList.remove("results-nav");

    optionsEl.innerHTML = "";

    q.options.forEach(opt => {
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt;

        if (selected !== null) {
            if (opt === q.ans) div.classList.add("correct");
            if (opt === selected && selected !== q.ans) div.classList.add("wrong");
        }

        div.onclick = (e) => {
            e.stopPropagation();
            selectedAnswers[current] = opt;
            saveProgress();
            loadQuestion();
        };

        optionsEl.appendChild(div);
    });

    card.classList.remove("flip");
}

function showResults() {
    const correct = getScore();
    const wrong = questions.length - correct;
    const percent = Math.round((correct / questions.length) * 100);

    progressEl.innerText = "Quiz Complete";
    card.classList.remove("flip");
    card.innerHTML = [
        '<div class="result-card">',
        '<p class="result-label">Final Score</p>',
        '<h2>' + correct + '/' + questions.length + ' correct</h2>',
        '<div class="score-grid">',
        '<div class="score-pill correct-score"><strong>' + correct + '</strong><span>Correct</span></div>',
        '<div class="score-pill wrong-score"><strong>' + wrong + '</strong><span>Wrong</span></div>',
        '<div class="score-pill percent-score"><strong>' + percent + '%</strong><span>Score</span></div>',
        '</div>',
        '</div>'
    ].join('');
    navEl.classList.add("results-nav");
    prevBtn.style.visibility = "visible";
    prevBtn.innerText = "Review Quiz";
    nextBtn.innerText = "Try Again";
}

card.addEventListener("click", () => {
    if (card.querySelector(".card-inner")) {
        card.classList.toggle("flip");
    }
});

function nextQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        selectedAnswers = new Array(questions.length).fill(null);
        saveProgress();
        window.location.reload();
        return;
    }

    if (current < questions.length - 1) {
        current++;
        saveProgress();
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        saveProgress();
        window.location.reload();
        return;
    }

    if (current > 0) {
        current--;
        saveProgress();
        loadQuestion();
    }
}

function goBack() {
    window.location.href = "microeconomics.html";
}

loadQuestion();
</script>

</body>
</html>
