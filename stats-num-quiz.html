<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numerical Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="stats-num-quiz.css">
</head>

<body>

<div class="top">
    <div class="back" onclick="goBack()">â† Back</div>
    <div id="progress">Question 1/30</div>
</div>

<div class="card" id="card">
    <div class="card-inner">
        <div class="card-front">
            <h3 id="question"></h3>
            <div id="options"></div>
        </div>
        <div class="card-back" id="answer"></div>
    </div>
</div>

<div class="nav">
    <button class="prev" onclick="prevQ()">Previous</button>
    <button class="next" onclick="nextQ()">Next</button>
</div>

<script>
const questions = [
    {q:"Mean of 10, 20, 30, 40 is?",options:["20","25","30","35"],ans:"25"},
    {q:"Median of 5, 10, 15, 20, 25 is?",options:["10","15","20","25"],ans:"15"},
    {q:"Mode of 2, 3, 3, 4, 5 is?",options:["2","3","4","5"],ans:"3"},
    {q:"Range of 12, 18, 25, 30 is?",options:["12","18","25","30"],ans:"18"},
    {q:"Probability of getting heads in one coin toss?",options:["1","1/2","1/3","0"],ans:"1/2"},
    {q:"Probability of getting a 4 on a die?",options:["1/2","1/4","1/6","1/8"],ans:"1/6"},
    {q:"Probability of even number on a die?",options:["1/2","1/3","1/6","2/3"],ans:"1/2"},
    {q:"Mean of 2, 4, 6, 8 is?",options:["4","5","6","7"],ans:"5"},
    {q:"Median of 1, 3, 5, 7, 9 is?",options:["3","5","7","9"],ans:"5"},
    {q:"Mode of 1, 2, 2, 3, 4 is?",options:["1","2","3","4"],ans:"2"},
    {q:"If variance is 16, standard deviation is?",options:["2","4","8","16"],ans:"4"},
    {q:"Probability of impossible event is?",options:["0","1","1/2","2"],ans:"0"},
    {q:"Probability of certain event is?",options:["0","1","1/2","3"],ans:"1"},
    {q:"If P(A)=0.5 and P(B)=0.4, maximum P(Aâˆ©B) is?",options:["0.1","0.4","0.5","0.9"],ans:"0.4"},
    {q:"Mean of 5, 10, 15 is?",options:["5","10","15","20"],ans:"10"},
    {q:"Range of 4, 8, 12, 20 is?",options:["8","12","16","20"],ans:"16"},
    {q:"Probability of tail in one coin toss?",options:["1","1/2","1/3","0"],ans:"1/2"},
    {q:"If Î» = 5 in Poisson distribution, Î» represents?",options:["Probability","Mean events","Variance only","Sample size"],ans:"Mean events"},
    {q:"If P(Aâˆ©B)=0.2 and P(B)=0.5, then P(A|B) is?",options:["0.1","0.2","0.4","0.5"],ans:"0.4"},
    {q:"Mean of 6, 8, 10 is?",options:["6","8","10","12"],ans:"8"},
    {q:"Median of 2, 4, 6, 8, 10 is?",options:["2","4","6","8"],ans:"6"},
    {q:"Probability of getting odd number on die?",options:["1/2","1/3","1/6","2/3"],ans:"1/2"},
    {q:"Standard deviation is square root of?",options:["Mean","Median","Variance","Mode"],ans:"Variance"},
    {q:"If PMF probabilities are added, result is?",options:["0","1","10","Depends"],ans:"1"},
    {q:"Mean of 3, 6, 9, 12 is?",options:["6","7.5","9","10"],ans:"7.5"},
    {q:"Range of 10, 15, 25, 35 is?",options:["15","20","25","30"],ans:"25"},
    {q:"Probability of red ball from 5 red and 5 blue balls?",options:["1/10","1/5","1/2","2/5"],ans:"1/2"},
    {q:"If variance is 25, standard deviation is?",options:["3","4","5","25"],ans:"5"},
    {q:"Mean of 1, 2, 3, 4, 5 is?",options:["2","3","4","5"],ans:"3"},
    {q:"Probability of getting number greater than 4 on die?",options:["1/6","2/6","3/6","4/6"],ans:"2/6"}
];

let current = 0;
let selectedAnswers = new Array(questions.length).fill(null);
const storageKey = "statsnumquiz";
const legacyProgressKey = "graphsProgress";

let savedIndex = localStorage.getItem(storageKey + "Current");
let savedAnswers = JSON.parse(localStorage.getItem(storageKey + "Answers"));

if (savedAnswers && savedAnswers.length === questions.length) selectedAnswers = savedAnswers;

if (savedIndex !== null) {
    current = Math.min(parseInt(savedIndex), questions.length - 1);
}

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const answerEl = document.getElementById("answer");
const progressEl = document.getElementById("progress");
const card = document.getElementById("card");
const navEl = document.querySelector(".nav");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

function getScore() {
    return selectedAnswers.reduce((score, answer, index) => {
        return answer === questions[index].ans ? score + 1 : score;
    }, 0);
}

function saveProgress() {
    const attempted = selectedAnswers.filter(answer => answer !== null).length;
    localStorage.setItem(storageKey + "Progress", attempted);
    localStorage.setItem(legacyProgressKey, attempted);
    localStorage.setItem(storageKey + "Current", current);
    localStorage.setItem(storageKey + "Answers", JSON.stringify(selectedAnswers));
}

function loadQuestion() {
    const q = questions[current];
    const selected = selectedAnswers[current];

    questionEl.innerText = q.q;
    answerEl.innerText = "Answer: " + q.ans;
    progressEl.innerText = "Question " + (current + 1) + "/" + questions.length;
    nextBtn.innerText = current === questions.length - 1 ? "Finish" : "Next";
    prevBtn.style.visibility = current === 0 ? "hidden" : "visible";
    navEl.classList.remove("results-nav");

    optionsEl.innerHTML = "";

    q.options.forEach(opt => {
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt;

        if (selected !== null) {
            if (opt === q.ans) div.classList.add("correct");
            if (opt === selected && selected !== q.ans) div.classList.add("wrong");
        }

        div.onclick = (e) => {
            e.stopPropagation();
            selectedAnswers[current] = opt;
            saveProgress();
            loadQuestion();
        };

        optionsEl.appendChild(div);
    });

    card.classList.remove("flip");
}

function showResults() {
    const correct = getScore();
    const wrong = questions.length - correct;
    const percent = Math.round((correct / questions.length) * 100);

    progressEl.innerText = "Quiz Complete";
    card.classList.remove("flip");
    card.innerHTML = [
        '<div class="result-card">',
        '<p class="result-label">Final Score</p>',
        '<h2>' + correct + '/' + questions.length + ' correct</h2>',
        '<div class="score-grid">',
        '<div class="score-pill correct-score"><strong>' + correct + '</strong><span>Correct</span></div>',
        '<div class="score-pill wrong-score"><strong>' + wrong + '</strong><span>Wrong</span></div>',
        '<div class="score-pill percent-score"><strong>' + percent + '%</strong><span>Score</span></div>',
        '</div>',
        '</div>'
    ].join('');
    navEl.classList.add("results-nav");
    prevBtn.style.visibility = "visible";
    prevBtn.innerText = "Review Quiz";
    nextBtn.innerText = "Try Again";
}

card.addEventListener("click", () => {
    if (card.querySelector(".card-inner")) {
        card.classList.toggle("flip");
    }
});

function nextQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        selectedAnswers = new Array(questions.length).fill(null);
        saveProgress();
        window.location.reload();
        return;
    }

    if (current < questions.length - 1) {
        current++;
        saveProgress();
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        saveProgress();
        window.location.reload();
        return;
    }

    if (current > 0) {
        current--;
        saveProgress();
        loadQuestion();
    }
}

function goBack() {
    window.location.href = "statistics.html";
}

loadQuestion();
</script>

</body>
</html>
