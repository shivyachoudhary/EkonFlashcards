<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theory II Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="micro-graphs-quiz.css">
</head>

<body>

<div class="top">
    <div class="back" onclick="goBack()">â† Back</div>
    <div id="progress">Question 1/30</div>
</div>

<div class="card" id="card">
    <div class="card-inner">
        <div class="card-front">
            <h3 id="question"></h3>
            <div id="options"></div>
        </div>
        <div class="card-back" id="answer"></div>
    </div>
</div>

<div class="nav">
    <button class="prev" onclick="prevQ()">Previous</button>
    <button class="next" onclick="nextQ()">Next</button>
</div>

<script>
const questions = [
   {q:"Perfect competition has:",options:["One seller","Few sellers","Many sellers","Government control"],ans:"Many sellers"},
{q:"Firms in perfect competition are:",options:["Price makers","Price takers","Monopolists","Cartels"],ans:"Price takers"},
{q:"Monopoly means:",options:["Many sellers","Single seller","Government market","Free market"],ans:"Single seller"},
{q:"Monopolist has:",options:["No control over price","Price-making power","Perfect competition","No profits"],ans:"Price-making power"},
{q:"Oligopoly market has:",options:["One firm","Few large firms","Infinite firms","No firms"],ans:"Few large firms"},
{q:"Oligopoly firms are:",options:["Independent","Interdependent","Government controlled","Non-strategic"],ans:"Interdependent"},
{q:"Price discrimination means:",options:["Selling at same price","Selling at different prices","No selling","Taxation"],ans:"Selling at different prices"},
{q:"First-degree price discrimination charges:",options:["Single market price","Maximum willingness to pay","Low prices only","Equal prices"],ans:"Maximum willingness to pay"},
{q:"Second-degree price discrimination depends on:",options:["Consumer age","Quantity consumed","Location","Government policy"],ans:"Quantity consumed"},
{q:"Third-degree price discrimination uses:",options:["Market segmentation","Exports","Taxes","Production"],ans:"Market segmentation"},
{q:"Cournot model assumes firms compete using:",options:["Advertising","Quantity","Quality","Technology"],ans:"Quantity"},
{q:"Cournot equilibrium occurs when:",options:["Firms maximize exports","No firm changes output","Prices become zero","Government intervenes"],ans:"No firm changes output"},
{q:"Bertrand model assumes firms compete using:",options:["Output","Prices","Advertising","Technology"],ans:"Prices"},
{q:"Bertrand competition may reduce price to:",options:["Maximum level","Marginal cost","Average cost","Zero"],ans:"Marginal cost"},
{q:"Stackelberg model includes:",options:["Leader and follower","Only monopoly","Only consumers","Government"],ans:"Leader and follower"},
{q:"Stackelberg leader chooses:",options:["Price after follower","Output first","Taxes","Imports"],ans:"Output first"},
{q:"Cartels are agreements among firms to:",options:["Increase competition","Reduce competition","Lower wages","Increase taxes"],ans:"Reduce competition"},
{q:"Game theory studies:",options:["Weather","Strategic behavior","Agriculture","Population"],ans:"Strategic behavior"},
{q:"Nash equilibrium means:",options:["Everyone changes strategy","No player benefits from changing alone","Prices become zero","Government fixes prices"],ans:"No player benefits from changing alone"},
{q:"General equilibrium studies:",options:["Single market","All markets together","Only labor market","Only money market"],ans:"All markets together"},
{q:"Walrasian equilibrium occurs when:",options:["Demand equals supply","Exports equal imports","Taxes equal spending","Prices become zero"],ans:"Demand equals supply"},
{q:"Welfare economics studies:",options:["Social well-being","Exports","Imports","Population"],ans:"Social well-being"},
{q:"Pareto efficiency means:",options:["Everyone becomes equal","No one can be better off without hurting another","Prices are fixed","Taxes are zero"],ans:"No one can be better off without hurting another"},
{q:"Market failure occurs when:",options:["Markets are efficient","Markets fail to allocate resources efficiently","Prices rise","Exports increase"],ans:"Markets fail to allocate resources efficiently"},
{q:"Externalities affect:",options:["Only producers","Third parties","Only consumers","Only government"],ans:"Third parties"},
{q:"Pollution is an example of:",options:["Positive externality","Negative externality","Public good","Private good"],ans:"Negative externality"},
{q:"Education is an example of:",options:["Negative externality","Positive externality","Monopoly","Cartel"],ans:"Positive externality"},
{q:"Public goods are:",options:["Rival and excludable","Non-rival and non-excludable","Private","Luxury"],ans:"Non-rival and non-excludable"},
{q:"Free rider problem occurs with:",options:["Private goods","Public goods","Luxury goods","Inferior goods"],ans:"Public goods"},
{q:"Government corrects externalities using:",options:["Taxes and subsidies","Exports","Imports","Tariffs"],ans:"Taxes and subsidies"}
];

let current = 0;
let selectedAnswers = new Array(questions.length).fill(null);
const storageKey = "micrographsquiz";
const legacyProgressKey = "graphsProgress";

let savedIndex = localStorage.getItem(storageKey + "Current");
let savedAnswers = JSON.parse(localStorage.getItem(storageKey + "Answers"));

if (savedAnswers && savedAnswers.length === questions.length) selectedAnswers = savedAnswers;

if (savedIndex !== null) {
    current = Math.min(parseInt(savedIndex), questions.length - 1);
}

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const answerEl = document.getElementById("answer");
const progressEl = document.getElementById("progress");
const card = document.getElementById("card");
const navEl = document.querySelector(".nav");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

function getScore() {
    return selectedAnswers.reduce((score, answer, index) => {
        return answer === questions[index].ans ? score + 1 : score;
    }, 0);
}

function saveProgress() {
    const attempted = selectedAnswers.filter(answer => answer !== null).length;
    localStorage.setItem(storageKey + "Progress", attempted);
    localStorage.setItem(legacyProgressKey, attempted);
    localStorage.setItem(storageKey + "Current", current);
    localStorage.setItem(storageKey + "Answers", JSON.stringify(selectedAnswers));
}

function loadQuestion() {
    const q = questions[current];
    const selected = selectedAnswers[current];

    questionEl.innerText = q.q;
    answerEl.innerText = "Answer: " + q.ans;
    progressEl.innerText = "Question " + (current + 1) + "/" + questions.length;
    nextBtn.innerText = current === questions.length - 1 ? "Finish" : "Next";
    prevBtn.style.visibility = current === 0 ? "hidden" : "visible";
    navEl.classList.remove("results-nav");

    optionsEl.innerHTML = "";

    q.options.forEach(opt => {
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt;

        if (selected !== null) {
            if (opt === q.ans) div.classList.add("correct");
            if (opt === selected && selected !== q.ans) div.classList.add("wrong");
        }

        div.onclick = (e) => {
            e.stopPropagation();
            selectedAnswers[current] = opt;
            saveProgress();
            loadQuestion();
        };

        optionsEl.appendChild(div);
    });

    card.classList.remove("flip");
}

function showResults() {
    const correct = getScore();
    const wrong = questions.length - correct;
    const percent = Math.round((correct / questions.length) * 100);

    progressEl.innerText = "Quiz Complete";
    card.classList.remove("flip");
    card.innerHTML = [
        '<div class="result-card">',
        '<p class="result-label">Final Score</p>',
        '<h2>' + correct + '/' + questions.length + ' correct</h2>',
        '<div class="score-grid">',
        '<div class="score-pill correct-score"><strong>' + correct + '</strong><span>Correct</span></div>',
        '<div class="score-pill wrong-score"><strong>' + wrong + '</strong><span>Wrong</span></div>',
        '<div class="score-pill percent-score"><strong>' + percent + '%</strong><span>Score</span></div>',
        '</div>',
        '</div>'
    ].join('');
    navEl.classList.add("results-nav");
    prevBtn.style.visibility = "visible";
    prevBtn.innerText = "Review Quiz";
    nextBtn.innerText = "Try Again";
}

card.addEventListener("click", () => {
    if (card.querySelector(".card-inner")) {
        card.classList.toggle("flip");
    }
});

function nextQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        selectedAnswers = new Array(questions.length).fill(null);
        saveProgress();
        window.location.reload();
        return;
    }

    if (current < questions.length - 1) {
        current++;
        saveProgress();
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQ() {
    if (card.querySelector(".result-card")) {
        current = 0;
        saveProgress();
        window.location.reload();
        return;
    }

    if (current > 0) {
        current--;
        saveProgress();
        loadQuestion();
    }
}

function goBack() {
    window.location.href = "microeconomics.html";
}

loadQuestion();
</script>

</body>
</html>
