<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macroeconomics</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="macroeconomics.css">
</head>

<body>

<div class="header">
    <div class="back" onclick="goBack()">â† Back to Dashboard</div>
    <h1>Macroeconomics</h1>
    <p>Understand the economy as a whole</p>
</div>

<div class="container">

    <!-- THEORY -->
    <div class="module-card">
        <h3>Intermediate Macroeconomics I</h3>
        <p><span id="theoryDone">0</span> / <span id="theoryTotal">30</span> quizzes completed</p>

        <div class="progress-bar">
            <div id="theoryProgress" class="progress-fill"></div>
        </div>

        <button class="primary" onclick="openLesson('theory')">Lesson</button>
        <button id="theoryQuizBtn" class="secondary" onclick="openQuiz('theory')">Attempt Quiz</button>
    </div>

    <!-- GRAPHS -->
    <div class="module-card">
        <h3>Intermediate Macroeconomics II</h3>
        <p><span id="graphsDone">0</span> / <span id="graphsTotal">30</span> quizzes completed</p>

        <div class="progress-bar">
            <div id="graphsProgress" class="progress-fill"></div>
        </div>

        <button class="primary" onclick="openLesson('graphs')">Lesson</button>
        <button id="graphsQuizBtn" class="secondary" onclick="openQuiz('graphs')">Attempt Quiz</button>
    </div>

</div>

<script>

const TOTAL = 30;

// GET DATA
let theoryDone = parseInt(localStorage.getItem("theoryProgress")) || 0;
let graphsDone = parseInt(localStorage.getItem("graphsProgress")) || 0;

// BUTTON TEXT LOGIC
function getButtonText(progress) {
    if (progress === 0) return "Attempt Quiz";
    if (progress > 0 && progress < TOTAL) return "Continue Quiz";
    if (progress === TOTAL) return "Reattempt Quiz";
}

// UPDATE UI
function updateUI() {
    document.getElementById("theoryDone").innerText = theoryDone;
    document.getElementById("graphsDone").innerText = graphsDone;

    document.getElementById("theoryTotal").innerText = TOTAL;
    document.getElementById("graphsTotal").innerText = TOTAL;

    let theoryPercent = (theoryDone / TOTAL) * 100;
    let graphsPercent = (graphsDone / TOTAL) * 100;

    document.getElementById("theoryProgress").style.width = theoryPercent + "%";
    document.getElementById("graphsProgress").style.width = graphsPercent + "%";

    document.getElementById("theoryQuizBtn").innerText = getButtonText(theoryDone);
    document.getElementById("graphsQuizBtn").innerText = getButtonText(graphsDone);
}

// ðŸš€ UPDATED QUIZ NAVIGATION (KEY PART)
function openQuiz(module) {

    if (module === "theory") {

        if (theoryDone === TOTAL) {
            localStorage.setItem("theoryProgress", 0);
            localStorage.removeItem("theoryAnswers");

            // âœ… RESET CORRECT KEY
            localStorage.setItem("theoryCurrent", 0);
        }

        window.location.href = "macro-theory-quiz.html";
    }

    else if (module === "graphs") {

        if (graphsDone === TOTAL) {
            localStorage.setItem("graphsProgress", 0);
            localStorage.removeItem("graphsAnswers");

            // âœ… RESET CORRECT KEY
            localStorage.setItem("graphsCurrent", 0);
        }

        window.location.href = "macro-graphs-quiz.html";
    }
}
// NAVIGATION
function openLesson(module) {
    if (module === "theory") {
        window.location.href = "macro-theory-lesson.html";
    } else {
        window.location.href = "macro-graphs-lesson.html";
    }
}

function goBack() {
    window.location.href = "dashboard.html";
}

// LOAD
window.onload = updateUI;

</script>

</body>
</html>
